<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Grab AR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; color: #fff; }
  canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; }
  .card { background: rgba(10, 12, 20, .72); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 14px; font-size: 14px; line-height: 1.45; }
  button { font: inherit; color: #fff; background: #2563eb; border: 0; border-radius: 10px; padding: 10px 16px; }
  button.secondary { background: rgba(255,255,255,.18); }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #start h1 { margin: 0; font-size: 24px; }
  #start p { margin: 0; max-width: 380px; line-height: 1.5; opacity: .9; }
  #start a { color: #7dd3fc; }
  #start button { font-size: 18px; padding: 14px 28px; }
  #note { color: #fca5a5; max-width: 380px; line-height: 1.5; }
  /* contenu affiché par-dessus la caméra pendant la session AR (dom-overlay) */
  #xrRoot { display: none; position: fixed; inset: 0; pointer-events: none; }
  #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
  #top { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; }
  #bottom { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
  #buttons { display: flex; gap: 8px; }
  #buttons button { pointer-events: auto; flex: 1; }
  #hint { text-align: center; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 6px; }
  .dot.on { background: #4ade80; } .dot.pinch { background: #fbbf24; }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="start">
  <h1>Cubes en réalité augmentée</h1>
  <p>Le téléphone détecte la table ou le sol tout seul, sans marqueur. Touche l'écran pour poser les cubes, puis attrape-les avec ta main libre : pince pouce + index, déplace, relâche ou lance.</p>
  <button id="go" disabled>Vérification…</button>
  <div id="note"></div>
</div>

<div id="xrRoot">
  <canvas id="overlay"></canvas>
  <div id="top">
    <div class="card"><span id="model">Mains : en attente</span></div>
    <div class="card"><span class="dot" id="dot"></span><span id="stateText">Aucune main</span></div>
  </div>
  <div id="bottom">
    <div class="card" id="hint"></div>
    <div id="buttons">
      <button id="replace" class="secondary" style="display:none">Replacer</button>
      <button id="flipV" class="secondary" title="Inverser haut/bas">↕</button>
      <button id="flipH" class="secondary" title="Inverser gauche/droite">↔</button>
      <button id="rotate" class="secondary" title="Tourner de 90°">⟳</button>
      <button id="quit" class="secondary">Quitter</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);

/* ---------- Réglages (1 unité = 1 mètre) ---------- */
const RADIUS = 0.06;          // demi-arête des cubes (cubes de 12 cm)
const HALF = 0.4;             // demi-côté de la surface de jeu
const CEILING = 1.5;          // hauteur max au-dessus de la surface
const GRAVITY = 9.8, AIR_DRAG = 0.15, FRICTION = 8, MAX_SPEED = 8;
const THROW_GAIN = 1.5;
const HAND_INTERVAL = 90;     // ms entre deux détections de la main
const HAND_WIDTH = 256;       // largeur de l'image envoyée à MediaPipe
const CUBE_COLORS = [0x38bdf8, 0xf472b6, 0xa78bfa, 0xfb923c, 0x34d399];
const COLOR_HOVER = 0xfbbf24, COLOR_GRAB = 0x4ade80;

/* ---------- Compatibilité ---------- */
let supported = false;
try { supported = !!(navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')); } catch {}
if (supported) {
  $('go').disabled = false; $('go').textContent = "Démarrer l'AR";
} else {
  $('go').style.display = 'none';
  $('note').innerHTML = "Ce navigateur ne propose pas la vraie AR (WebXR). Elle fonctionne sur <b>Android avec Chrome</b> (téléphone compatible ARCore). " +
    "Sur iPhone, Safari n'offre pas cette technologie : utilise le <a href=\"ar-marker.html\">mode marqueur</a>, qui demande d'afficher ou d'imprimer un repère.";
}

/* ---------- Scène ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(1, 3, 1.5);
scene.add(sun);

// surface de jeu : grille + plan translucide, qui suit le réticule jusqu'à la pose
const surface = { placed: false, center: new THREE.Vector3() };
const surfaceGroup = new THREE.Group();
surfaceGroup.visible = false;
scene.add(surfaceGroup);
{
  const pts = [], N = 8;
  for (let i = 0; i <= N; i++) {
    const t = -HALF + 2 * HALF * i / N;
    pts.push(t, 0.001, -HALF, t, 0.001, HALF, -HALF, 0.001, t, HALF, 0.001, t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  surfaceGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 })));
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2 * HALF, 2 * HALF),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, depthWrite: false }));
  plane.rotation.x = -Math.PI / 2;
  surfaceGroup.add(plane);
}
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.065, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

const cubeGeo = new THREE.BoxGeometry(2 * RADIUS, 2 * RADIUS, 2 * RADIUS);
const edgeGeo = new THREE.EdgesGeometry(cubeGeo);
const shadowGeo = new THREE.PlaneGeometry(2, 2);
const cubes = CUBE_COLORS.map(color => {
  const mesh = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.3, flatShading: true }));
  mesh.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));
  mesh.visible = false;
  scene.add(mesh);
  const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  scene.add(shadow);
  return { mesh, shadow, color, velocity: new THREE.Vector3(), spin: new THREE.Vector3(), supported: false };
});

function placeCubes() {
  surface.placed = true;
  const c = surface.center;
  surfaceGroup.position.copy(c);
  surfaceGroup.visible = true;
  reticle.visible = false;
  cubes.forEach((cube, i) => {
    const col = [-0.16, 0, 0.16, -0.08, 0.08][i];                       // 3 cubes derrière, 2 devant
    cube.mesh.position.set(c.x + col, c.y + RADIUS + 0.1 + i * 0.08, c.z + (i < 3 ? -0.1 : 0.08));
    cube.mesh.rotation.set(0, 0, 0);
    cube.velocity.set(0, 0, 0); cube.spin.set(0, 0, 0);
    cube.mesh.visible = cube.shadow.visible = true;
  });
  $('replace').style.display = '';
}
function unplace() {
  endGrab();
  surface.placed = false;
  for (const c of cubes) c.mesh.visible = c.shadow.visible = false;
  surfaceGroup.visible = false;
  $('replace').style.display = 'none';
}

/* ---------- Saisie (main ou doigt) ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const handCam = new THREE.PerspectiveCamera();      // caméra de la vue AR, pour viser avec la main
handCam.matrixAutoUpdate = false;
const target = new THREE.Vector3();
let held = null, hovering = null, touchSource = null;
let grabDist0 = 1, grabSize0 = 1;
const grabOffset = new THREE.Vector3();
const history = [];

function updateHandCam(view) {
  handCam.matrixWorld.fromArray(view.transform.matrix);
  handCam.matrixWorldInverse.copy(handCam.matrixWorld).invert();
  handCam.projectionMatrix.fromArray(view.projectionMatrix);
  handCam.projectionMatrixInverse.copy(handCam.projectionMatrix).invert();
  handCam.position.setFromMatrixPosition(handCam.matrixWorld);
}

// cube visé par un point de l'écran en coordonnées normalisées (-1..1), avec une tolérance autour du centre
function pickCube(nx, ny) {
  if (!surface.placed) return null;
  ndc.set(nx, ny);
  raycaster.setFromCamera(ndc, handCam);
  const hits = raycaster.intersectObjects(cubes.map(c => c.mesh), false);
  if (hits.length) return cubes.find(c => c.mesh === hits[0].object);
  const aspect = innerWidth / innerHeight;
  let best = null, bestD = 0.2;
  for (const c of cubes) {
    const p = c.mesh.position.clone().project(handCam);
    if (p.z > 1) continue;
    const d = Math.hypot((p.x - nx) * aspect, p.y - ny);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function startGrab(cube, origin, dir, handSize) {
  held = cube;
  grabDist0 = cube.mesh.position.distanceTo(origin);
  grabSize0 = handSize || 1;
  grabOffset.copy(cube.mesh.position).sub(origin.clone().addScaledVector(dir, grabDist0));
  target.copy(cube.mesh.position);
  history.length = 0;
}
function moveGrab(origin, dir, handSize) {
  // une main 2x plus grosse = 2x plus proche de la caméra
  const dist = handSize ? THREE.MathUtils.clamp(grabDist0 * grabSize0 / handSize, 0.15, 3) : grabDist0;
  target.copy(origin).addScaledVector(dir, dist).add(grabOffset);
  const now = performance.now();
  history.push({ t: now, p: target.clone() });
  while (history.length && now - history[0].t > 400) history.shift();
}
function endGrab() {
  if (!held) return;
  const { velocity, spin } = held;
  // vitesse de la main juste avant le relâchement (on ignore les 40 dernières ms : l'ouverture des doigts fausse la position)
  const now = performance.now();
  let end = null;
  for (let i = history.length - 1; i >= 0; i--) if (history[i].t <= now - 40) { end = history[i]; break; }
  const start = end && history.find(s => s.t >= end.t - 150);
  velocity.set(0, 0, 0);
  if (end && start && end.t - start.t > 30 && now - end.t < 250) {
    velocity.copy(end.p).sub(start.p).divideScalar((end.t - start.t) / 1000).multiplyScalar(THROW_GAIN);
    if (velocity.length() > MAX_SPEED) velocity.setLength(MAX_SPEED);
  }
  spin.set(velocity.z, velocity.length() * 0.15, -velocity.x).multiplyScalar(0.3 / RADIUS);
  history.length = 0;
  held = null;
}

/* ---------- Physique : cubes solides, sans rebond, empilables ---------- */
function clampToSurface(c) {
  const p = c.mesh.position, v = c.velocity, o = surface.center;
  const b = HALF - RADIUS, floor = o.y + RADIUS;
  if (p.x > o.x + b) { p.x = o.x + b; v.x = Math.min(v.x, 0); }
  if (p.x < o.x - b) { p.x = o.x - b; v.x = Math.max(v.x, 0); }
  if (p.z > o.z + b) { p.z = o.z + b; v.z = Math.min(v.z, 0); }
  if (p.z < o.z - b) { p.z = o.z - b; v.z = Math.max(v.z, 0); }
  if (p.y > o.y + CEILING) { p.y = o.y + CEILING; v.y = Math.min(v.y, 0); }
  if (p.y < floor) { p.y = floor; v.y = 0; c.supported = true; }
}

function collide(a, b) {
  const pa = a.mesh.position, pb = b.mesh.position, S = 2 * RADIUS;
  const d = { x: pa.x - pb.x, y: pa.y - pb.y, z: pa.z - pb.z };
  const o = { x: S - Math.abs(d.x), y: S - Math.abs(d.y), z: S - Math.abs(d.z) };
  if (o.x <= 0 || o.y <= 0 || o.z <= 0) return;

  let axis = 'y', best = o.y * 0.75;                    // préférence pour la verticale (empilement)
  if (o.x < best) { axis = 'x'; best = o.x; }
  if (o.z < best) { axis = 'z'; best = o.z; }
  const pen = o[axis], s = d[axis] >= 0 ? 1 : -1;

  // le cube tenu n'est jamais repoussé, sauf quand il est posé sur un autre cube
  let wa = a === held ? 0 : 1, wb = b === held ? 0 : 1;
  if (axis === 'y') {
    if (a === held && s > 0) { wa = 1; wb = 0; }
    if (b === held && s < 0) { wb = 1; wa = 0; }
  }
  if (wa + wb === 0) return;
  const move = pen / (wa + wb);
  pa[axis] += s * move * wa;
  pb[axis] -= s * move * wb;

  const upper = s > 0 ? a : b, lower = s > 0 ? b : a;
  if (axis === 'y') {
    upper.supported = true;
    if (upper.velocity.y < lower.velocity.y) upper.velocity.y = lower.velocity.y;
    if (lower.velocity.y > upper.velocity.y) lower.velocity.y = upper.velocity.y;
  } else {
    const va = a.velocity[axis], vb = b.velocity[axis];
    if ((va - vb) * s < 0) {                            // ils se rapprochent : choc parfaitement mou
      a.velocity[axis] = b.velocity[axis] = (a === held || b === held) ? 0 : (va + vb) / 2;
    }
  }
}

function stepPhysics(dt) {
  for (const c of cubes) {
    c.supported = false;
    const p = c.mesh.position;
    if (c === held) { p.lerp(target, 0.35); c.velocity.set(0, 0, 0); continue; }
    c.velocity.y -= GRAVITY * dt;
    c.velocity.multiplyScalar(1 - AIR_DRAG * dt);
    if (c.velocity.length() > MAX_SPEED) c.velocity.setLength(MAX_SPEED);
    p.addScaledVector(c.velocity, dt);
  }
  for (let it = 0; it < 6; it++) {
    for (const c of cubes) clampToSurface(c);
    for (let i = 0; i < cubes.length; i++)
      for (let j = i + 1; j < cubes.length; j++) collide(cubes[i], cubes[j]);
  }
  for (const c of cubes) clampToSurface(c);
  const f = 1 - Math.exp(-FRICTION * dt);
  for (const c of cubes) if (c.supported && c !== held) { c.velocity.x -= c.velocity.x * f; c.velocity.z -= c.velocity.z * f; }
}

function animateCubes(dt) {
  const q = Math.PI / 2, snap = 1 - Math.exp(-8 * dt);
  const floor = surface.center.y + RADIUS;
  for (const c of cubes) {
    const m = c.mesh;
    if (c === held) { c.spin.set(0, 0, 0); m.rotation.y += 0.03; m.rotation.x += 0.012; }
    else if (c.supported) {
      for (const a of ['x', 'y', 'z']) m.rotation[a] += (Math.round(m.rotation[a] / q) * q - m.rotation[a]) * snap;
      c.spin.multiplyScalar(Math.exp(-6 * dt));
    } else {
      m.rotation.x += c.spin.x * dt; m.rotation.y += c.spin.y * dt; m.rotation.z += c.spin.z * dt;
    }
    const h = Math.max(0, m.position.y - floor), k = Math.min(h / 0.6, 0.8);
    c.shadow.rotation.z = m.rotation.y;
    c.shadow.position.set(m.position.x, surface.center.y + 0.002, m.position.z);
    c.shadow.scale.setScalar(RADIUS * (1.1 - k * 0.6));
    c.shadow.material.opacity = 0.5 * (1 - k);
    m.material.color.setHex(c === held ? COLOR_GRAB : c === hovering ? COLOR_HOVER : c.color);
    m.scale.setScalar(c === held ? 1.1 : 1);
  }
}

/* ---------- Détection de la main sur l'image de la caméra ---------- */
let landmarker = null;
const withTimeout = (p, ms, label) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' : délai dépassé')), ms))
]);
async function loadHands() {
  $('model').textContent = 'Mains : chargement…';
  try {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await withTimeout(import(base + '/vision_bundle.mjs'), 30000, 'Bibliothèque MediaPipe');
    const fileset = await withTimeout(vision.FilesetResolver.forVisionTasks(base + '/wasm'), 30000, 'Runtime WASM');
    const modelPath = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const make = delegate => vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: modelPath, delegate }, runningMode: 'VIDEO', numHands: 1
    });
    try { landmarker = await withTimeout(make('GPU'), 40000, 'Modèle (GPU)'); }
    catch { landmarker = await withTimeout(make('CPU'), 40000, 'Modèle (CPU)'); }
    $('model').textContent = 'Mains : prêt ✓';
  } catch (e) {
    $('model').textContent = 'Mains : indisponible (' + e.message + ')';
  }
}
if (supported) loadHands();

// L'image de la caméra peut arriver retournée ou tournée selon l'appareil. Par défaut elle est lue de haut en bas,
// sans miroir ni rotation ; les boutons ↕ ↔ ⟳ corrigent si le squelette ne colle pas à ta vraie main.
const handView = { rot: 0, flipV: false, flipH: false };
try { Object.assign(handView, JSON.parse(localStorage.getItem('handView2') || '{}')); } catch {}
function changeView(fn) {
  fn(handView);
  try { localStorage.setItem('handView2', JSON.stringify(handView)); } catch {}
}
$('flipV').addEventListener('click', () => changeView(v => { v.flipV = !v.flipV; }));
$('flipH').addEventListener('click', () => changeView(v => { v.flipH = !v.flipH; }));
$('rotate').addEventListener('click', () => changeView(v => { v.rot = (v.rot + 1) % 4; }));

let readFB = null, readBuf = null;
const handCanvas = document.createElement('canvas');
const handCtx = handCanvas.getContext('2d');

// lit les pixels de l'image caméra (texture WebGL fournie par le navigateur)
function readCameraPixels(glBinding, xrCamera) {
  const gl = renderer.getContext();
  const tex = glBinding.getCameraImage(xrCamera);
  if (!tex) return null;
  const w = xrCamera.width, h = xrCamera.height;
  const prev = gl.getParameter(gl.FRAMEBUFFER_BINDING);
  if (!readFB) readFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, readFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  let ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  if (ok) {
    if (!readBuf || readBuf.length !== w * h * 4) readBuf = new Uint8Array(w * h * 4);
    gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, readBuf);
  }
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, prev);
  return ok ? { data: readBuf, w, h } : null;
}

// réduit l'image et applique l'orientation choisie ; renvoie un canvas droit, à l'endroit
function buildHandImage({ data, w, h }) {
  const { rot, flipV, flipH } = handView;
  const sw = HAND_WIDTH, sh = Math.round(HAND_WIDTH * ((rot % 2) ? w / h : h / w));
  if (handCanvas.width !== sw || handCanvas.height !== sh) { handCanvas.width = sw; handCanvas.height = sh; }
  const img = handCtx.createImageData(sw, sh), out = img.data;
  for (let y = 0; y < sh; y++) {
    for (let x = 0; x < sw; x++) {
      const u = flipH ? 1 - (x + 0.5) / sw : (x + 0.5) / sw, v = (y + 0.5) / sh;
      let su, sv;
      if (rot === 0) { su = u; sv = v; }
      else if (rot === 1) { su = v; sv = 1 - u; }
      else if (rot === 2) { su = 1 - u; sv = 1 - v; }
      else { su = 1 - v; sv = u; }
      const col = Math.min(w - 1, Math.floor(su * w));
      const r = Math.min(h - 1, Math.floor(sv * h));
      const row = flipV ? h - 1 - r : r;
      const i = (row * w + col) * 4, o = (y * sw + x) * 4;
      out[o] = data[i]; out[o + 1] = data[i + 1]; out[o + 2] = data[i + 2]; out[o + 3] = 255;
    }
  }
  handCtx.putImageData(img, 0, 0);
  return handCanvas;
}

const octx = $('overlay').getContext('2d');
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const setState = (cls, text) => { $('dot').className = 'dot ' + cls; $('stateText').textContent = text; };
let cx = 0.5, cy = 0.5, smSize = 0, handActive = false;
const dirTmp = new THREE.Vector3();

function trackHand(glBinding, xrCamera) {
  const px = readCameraPixels(glBinding, xrCamera);
  if (!px) { $('model').textContent = 'Mains : image caméra illisible'; return; }
  const res = landmarker.detectForVideo(buildHandImage(px), performance.now());
  octx.clearRect(0, 0, innerWidth, innerHeight);

  if (!res.landmarks.length) {
    handActive = false; smSize = 0;
    if (held && !touchSource) endGrab();
    if (!touchSource) hovering = null;
    setState('', 'Aucune main');
    return;
  }
  handActive = true;
  const raw = res.landmarks[0];
  const W = innerWidth, H = innerHeight;

  octx.strokeStyle = 'rgba(255,255,255,.85)'; octx.lineWidth = 3;
  for (const [a, b] of BONES) { octx.beginPath(); octx.moveTo(raw[a].x * W, raw[a].y * H); octx.lineTo(raw[b].x * W, raw[b].y * H); octx.stroke(); }
  octx.fillStyle = '#38bdf8';
  for (const p of raw) { octx.beginPath(); octx.arc(p.x * W, p.y * H, 4, 0, 7); octx.fill(); }

  const aspect = px.w / px.h;
  const rawSize = Math.hypot(raw[0].x - raw[9].x, (raw[0].y - raw[9].y) / aspect);
  smSize = smSize ? smSize + (rawSize - smSize) * 0.5 : rawSize;
  const pinchDist = Math.hypot(raw[4].x - raw[8].x, (raw[4].y - raw[8].y) / aspect) / smSize;
  cx += ((raw[4].x + raw[8].x) / 2 - cx) * 0.5; cy += ((raw[4].y + raw[8].y) / 2 - cy) * 0.5;

  const pinching = held && !touchSource ? pinchDist < 0.45 : pinchDist < 0.3;   // hystérésis
  const nx = cx * 2 - 1, ny = 1 - cy * 2;
  hovering = held && !touchSource ? held : pickCube(nx, ny);

  octx.beginPath(); octx.arc(cx * W, cy * H, pinching ? 12 : 18, 0, 7);
  octx.strokeStyle = pinching ? '#fbbf24' : '#fff'; octx.lineWidth = 3; octx.stroke();

  if (surface.placed && !touchSource) {
    ndc.set(nx, ny);
    raycaster.setFromCamera(ndc, handCam);
    dirTmp.copy(raycaster.ray.direction);
    if (pinching && !held && hovering) startGrab(hovering, handCam.position, dirTmp, smSize);
    if (!pinching && held) endGrab();
    if (held) moveGrab(handCam.position, dirTmp, smSize);
  }
  setState(held ? 'pinch' : 'on', held ? 'Cube attrapé' : pinching ? 'Pincement (hors cube)' : 'Main détectée');
}

/* ---------- Session WebXR ---------- */
let session = null, refSpace = null, hitSource = null, glBinding = null;
let lastHand = 0, lastFrame = performance.now(), hasCameraAccess = false;
const q = new THREE.Quaternion(), rayDir = new THREE.Vector3(), rayOrigin = new THREE.Vector3();

function rayFromPose(pose) {
  const t = pose.transform;
  rayOrigin.set(t.position.x, t.position.y, t.position.z);
  q.set(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w);
  rayDir.set(0, 0, -1).applyQuaternion(q);
}

function onXRFrame(time, frame) {
  if (!frame) return;
  const now = performance.now();
  const dt = Math.min((now - lastFrame) / 1000, 1 / 30) || 1 / 60;
  lastFrame = now;
  refSpace = renderer.xr.getReferenceSpace();

  const pose = frame.getViewerPose(refSpace);
  if (pose && pose.views.length) {
    const view = pose.views[0];
    updateHandCam(view);
    hasCameraAccess = !!view.camera && !!glBinding;
    if (landmarker && hasCameraAccess && now - lastHand > HAND_INTERVAL) { lastHand = now; trackHand(glBinding, view.camera); }
  }

  // réticule : où le regard de la caméra rencontre une surface horizontale
  if (!surface.placed && hitSource) {
    const results = frame.getHitTestResults(hitSource);
    const hit = results.length && results[0].getPose(refSpace);
    if (hit && hit.transform.matrix[5] > 0.8) {            // la normale pointe vers le haut : table ou sol
      reticle.matrix.fromArray(hit.transform.matrix);
      surface.center.setFromMatrixPosition(reticle.matrix);
      surfaceGroup.position.copy(surface.center);
      reticle.visible = surfaceGroup.visible = true;
    } else {
      reticle.visible = surfaceGroup.visible = false;
    }
  }

  // cube tenu au doigt
  if (touchSource && held) {
    const p = frame.getPose(touchSource.targetRaySpace, refSpace);
    if (p) { rayFromPose(p); moveGrab(rayOrigin, rayDir, 0); }
  }

  if (surface.placed) { stepPhysics(dt); animateCubes(dt); }

  if (!hasCameraAccess) $('model').textContent = 'Mains : caméra non accessible, déplace les cubes au doigt';
  $('hint').textContent = !surface.placed
    ? (reticle.visible ? "Touche l'écran pour poser les cubes ici." : 'Bouge lentement le téléphone pour détecter une table ou le sol.')
    : (held ? 'Cube attrapé : bouge, relâche ou lance !' : 'Pince pouce + index sur un cube pour l\'attraper (ou touche-le du doigt).');
  renderer.render(scene, camera);
}

async function startAR() {
  $('xrRoot').style.display = 'block';          // le conteneur doit être affiché quand la session démarre
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay', 'camera-access'],
      domOverlay: { root: $('xrRoot') },
    });
  } catch (e) {
    $('xrRoot').style.display = 'none';
    $('note').textContent = 'Impossible de démarrer la session AR : ' + e.message;
    return;
  }
  $('start').style.display = 'none';
  $('overlay').width = innerWidth; $('overlay').height = innerHeight;

  await renderer.xr.setSession(session);
  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitSource = await session.requestHitTestSource({ space: viewerSpace });
  glBinding = ('XRWebGLBinding' in window) ? new XRWebGLBinding(session, renderer.getContext()) : null;

  session.addEventListener('select', () => { if (!surface.placed && reticle.visible) placeCubes(); });
  session.addEventListener('selectstart', e => {
    if (!surface.placed || held || e.inputSource.targetRayMode !== 'screen') return;
    const p = e.frame.getPose(e.inputSource.targetRaySpace, refSpace);
    if (!p) return;
    rayFromPose(p);
    raycaster.set(rayOrigin, rayDir);
    const hit = raycaster.intersectObjects(cubes.map(c => c.mesh), false)[0];
    if (hit) { touchSource = e.inputSource; startGrab(cubes.find(c => c.mesh === hit.object), rayOrigin, rayDir, 0); }
  });
  session.addEventListener('selectend', e => { if (e.inputSource === touchSource) { touchSource = null; endGrab(); } });
  session.addEventListener('end', () => {
    renderer.setAnimationLoop(null);
    session = null; hitSource = null; glBinding = null; touchSource = null;
    unplace();
    reticle.visible = false;
    $('xrRoot').style.display = 'none';
    $('start').style.display = 'flex';
  });
  renderer.setAnimationLoop(onXRFrame);
}

$('go').addEventListener('click', startAR);
$('quit').addEventListener('click', () => session && session.end());
$('replace').addEventListener('click', unplace);
// les boutons ne doivent pas déclencher la pose des cubes
for (const id of ['replace', 'flipV', 'flipH', 'rotate', 'quit']) $(id).addEventListener('beforexrselect', e => e.preventDefault());
</script>
