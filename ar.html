<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Grab AR</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; color: #fff; touch-action: none; -webkit-user-select: none; user-select: none; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #scene, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; }
  #overlay { pointer-events: none; }
  .card { background: rgba(10, 12, 20, .72); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 10px 14px; backdrop-filter: blur(6px); font-size: 14px; line-height: 1.45; }
  #top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
  #bottom { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
  #hint { text-align: center; pointer-events: none; }
  #controls { display: flex; align-items: center; gap: 10px; }
  #controls input { flex: 1; }
  button { font: inherit; color: #fff; background: #2563eb; border: 0; border-radius: 10px; padding: 10px 16px; }
  button.secondary { background: rgba(255,255,255,.16); }
  #start { position: fixed; inset: 0; background: rgba(5, 7, 13, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
  #start h1 { margin: 0; font-size: 24px; }
  #start p { margin: 0; max-width: 360px; opacity: .85; line-height: 1.5; }
  #start button { font-size: 18px; padding: 14px 28px; }
  #err { color: #fca5a5; max-width: 360px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #666; margin-right: 6px; }
  .dot.on { background: #4ade80; } .dot.pinch { background: #fbbf24; }
</style>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="scene"></canvas>
<canvas id="overlay"></canvas>

<div id="top">
  <div class="card" id="model">Mains : en attente</div>
  <div class="card"><span class="dot" id="dot"></span><span id="stateText">Aucune main</span></div>
</div>

<div id="bottom">
  <div class="card" id="hint"></div>
  <div class="card" id="controls">
    <label id="dropLabel" style="display:flex;flex:1;align-items:center;gap:10px">
      <span id="dropText" style="white-space:nowrap">Surface à 1,0 m</span>
      <input id="drop" type="range" min="0.3" max="1.8" step="0.05" value="1.0">
    </label>
    <button id="replace" class="secondary" style="display:none">Replacer</button>
  </div>
</div>

<div id="start">
  <h1>Cubes en réalité augmentée</h1>
  <p>Vise une surface (table, sol), touche l'écran pour y poser les cubes, puis attrape-les avec ta main libre : pince pouce + index, déplace, relâche ou lance.</p>
  <button id="go">Démarrer l'AR</button>
  <div id="err"></div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const DEG = Math.PI / 180;

/* ---------- Réglages (1 unité = 1 mètre) ---------- */
const RADIUS = 0.06;         // demi-arête des cubes
const HALF = 0.4;            // demi-côté de la surface de jeu
const CEILING = 1.5;         // hauteur max au-dessus de la surface
const GRAVITY = 9.8, AIR_DRAG = 0.15, FRICTION = 8, MAX_SPEED = 8;
const THROW_GAIN = 1.5, Z_THROW_BOOST = 1.3;
const CAMERA_FOV = 60;       // champ de vision vertical approximatif de la caméra arrière en portrait
const CUBE_COLORS = [0x38bdf8, 0xf472b6, 0xa78bfa, 0xfb923c, 0x34d399];
const COLOR_HOVER = 0xfbbf24, COLOR_GRAB = 0x4ade80;

/* ---------- Scène ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.05, 50);
scene.add(new THREE.AmbientLight(0xffffff, 0.8));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(1, 3, 1.5);
scene.add(sun);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  $('overlay').width = innerWidth; $('overlay').height = innerHeight;
}
addEventListener('resize', resize);
resize();

/* ---------- Orientation du téléphone (3 degrés de liberté) ---------- */
const targetQ = new THREE.Quaternion();
const euler = new THREE.Euler(), q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const q0 = new THREE.Quaternion(), zee = new THREE.Vector3(0, 0, 1);
let haveOrientation = false;
function onOrient(e) {
  if (e.alpha == null) return;
  const screenAngle = (screen.orientation ? screen.orientation.angle : window.orientation || 0) * DEG;
  euler.set(e.beta * DEG, e.alpha * DEG, -e.gamma * DEG, 'YXZ');
  targetQ.setFromEuler(euler).multiply(q1).multiply(q0.setFromAxisAngle(zee, -screenAngle));
  if (!haveOrientation) camera.quaternion.copy(targetQ);
  haveOrientation = true;
}

/* ---------- Surface : grille, réticule, cubes ---------- */
const surface = { placed: false, center: new THREE.Vector3(0, -1, -1.5) };
const surfaceGroup = new THREE.Group();
scene.add(surfaceGroup);
{
  const pts = [], N = 8;
  for (let i = 0; i <= N; i++) {
    const t = -HALF + 2 * HALF * i / N;
    pts.push(t, 0, -HALF, t, 0, HALF, -HALF, 0, t, HALF, 0, t);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  surfaceGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 })));
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(2 * HALF, 2 * HALF),
    new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, depthWrite: false }));
  plane.rotation.x = -Math.PI / 2;
  surfaceGroup.add(plane);
}
const reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.065, 40),
  new THREE.MeshBasicMaterial({ color: 0xfbbf24, side: THREE.DoubleSide }));
reticle.rotation.x = -Math.PI / 2;
reticle.position.y = 0.003;
surfaceGroup.add(reticle);

const cubeGeo = new THREE.BoxGeometry(2 * RADIUS, 2 * RADIUS, 2 * RADIUS);
const edgeGeo = new THREE.EdgesGeometry(cubeGeo);
const shadowGeo = new THREE.PlaneGeometry(2, 2);
const cubes = CUBE_COLORS.map(color => {
  const mesh = new THREE.Mesh(cubeGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.35, metalness: 0.3, flatShading: true }));
  mesh.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0xffffff })));
  mesh.visible = false;
  scene.add(mesh);
  const shadow = new THREE.Mesh(shadowGeo, new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.45, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2;
  shadow.visible = false;
  scene.add(shadow);
  return { mesh, shadow, color, velocity: new THREE.Vector3(), spin: new THREE.Vector3(), supported: false };
});

const floorY = () => surface.center.y + RADIUS;   // hauteur du centre d'un cube posé

function placeCubes() {
  surface.placed = true;
  const c = surface.center;
  cubes.forEach((cube, i) => {
    const col = [-0.16, 0, 0.16, -0.08, 0.08][i];            // 3 cubes derrière, 2 devant
    cube.mesh.position.set(c.x + col, c.y + RADIUS + 0.1 + i * 0.08, c.z + (i < 3 ? -0.1 : 0.08));
    cube.mesh.rotation.set(0, 0, 0);
    cube.velocity.set(0, 0, 0); cube.spin.set(0, 0, 0);
    cube.mesh.visible = cube.shadow.visible = true;
  });
  reticle.visible = false;
  $('replace').style.display = '';
  $('dropLabel').style.display = 'none';
}
function unplace() {
  endGrab();
  surface.placed = false;
  for (const c of cubes) c.mesh.visible = c.shadow.visible = false;
  reticle.visible = true;
  $('replace').style.display = 'none';
  $('dropLabel').style.display = 'flex';
}

/* ---------- Saisie ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const target = new THREE.Vector3();
let held = null, hovering = null;
let grabDist0 = 1, grabSize0 = 1, grabOffset = new THREE.Vector3();
const history = [];

function screenRay(px, py) {
  ndc.set((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  return raycaster.ray.direction.clone();
}

// cube sous le curseur : rayon d'abord, puis tolérance de 70 px autour du centre
function pickCube(px, py) {
  if (!surface.placed) return null;
  screenRay(px, py);
  const hits = raycaster.intersectObjects(cubes.map(c => c.mesh), false);
  if (hits.length) return cubes.find(c => c.mesh === hits[0].object);
  let best = null, bestD = 70;
  for (const c of cubes) {
    const p = c.mesh.position.clone().project(camera);
    if (p.z > 1) continue;
    const d = Math.hypot((p.x + 1) / 2 * innerWidth - px, (1 - p.y) / 2 * innerHeight - py);
    if (d < bestD) { bestD = d; best = c; }
  }
  return best;
}

function startGrab(cube, px, py, handSize) {
  held = cube;
  const dir = screenRay(px, py);
  grabDist0 = cube.mesh.position.distanceTo(camera.position);
  grabSize0 = handSize || 1;
  grabOffset.copy(cube.mesh.position).sub(camera.position.clone().addScaledVector(dir, grabDist0));
  target.copy(cube.mesh.position);
  history.length = 0;
}
function moveGrab(px, py, handSize) {
  const dir = screenRay(px, py);
  // une main 2x plus grosse = 2x plus proche de la caméra
  const dist = handSize ? THREE.MathUtils.clamp(grabDist0 * grabSize0 / handSize, 0.25, 4) : grabDist0;
  target.copy(camera.position).addScaledVector(dir, dist).add(grabOffset);
  const now = performance.now();
  history.push({ t: now, p: target.clone() });
  while (history.length && now - history[0].t > 400) history.shift();
}
function endGrab() {
  if (!held) return;
  const { velocity, spin } = held;
  // vitesse de la main juste avant le relâchement (on ignore les 40 dernières ms : l'ouverture des doigts fausse la position)
  const now = performance.now();
  let end = null;
  for (let i = history.length - 1; i >= 0; i--) if (history[i].t <= now - 40) { end = history[i]; break; }
  const start = end && history.find(s => s.t >= end.t - 150);
  velocity.set(0, 0, 0);
  if (end && start && end.t - start.t > 30 && now - end.t < 250) {
    velocity.copy(end.p).sub(start.p).divideScalar((end.t - start.t) / 1000).multiplyScalar(THROW_GAIN);
    if (velocity.length() > MAX_SPEED) velocity.setLength(MAX_SPEED);
  }
  spin.set(velocity.z, velocity.length() * 0.15, -velocity.x).multiplyScalar(0.3 / RADIUS);
  history.length = 0;
  held = null;
}

/* ---------- Toucher l'écran : poser les cubes, ou attraper un cube au doigt ---------- */
let touching = false, handActive = false, started = false;
$('scene').addEventListener('pointerdown', e => {
  if (!started) return;
  if (!surface.placed) { if (reticle.visible && reticleOk) placeCubes(); return; }
  if (handActive) return;
  const c = pickCube(e.clientX, e.clientY);
  if (c) { touching = true; startGrab(c, e.clientX, e.clientY); }
});
addEventListener('pointermove', e => { if (touching) moveGrab(e.clientX, e.clientY); });
addEventListener('pointerup', () => { if (touching) { touching = false; endGrab(); } });
$('replace').addEventListener('click', unplace);
$('drop').addEventListener('input', e => { $('dropText').textContent = 'Surface à ' + Number(e.target.value).toFixed(1).replace('.', ',') + ' m'; });

/* ---------- Physique : cubes solides, sans rebond, empilables ---------- */
function clampToSurface(c) {
  const p = c.mesh.position, v = c.velocity, o = surface.center;
  const bx = HALF - RADIUS, floor = floorY(), ceil = o.y + CEILING;
  if (p.x > o.x + bx) { p.x = o.x + bx; v.x = Math.min(v.x, 0); }
  if (p.x < o.x - bx) { p.x = o.x - bx; v.x = Math.max(v.x, 0); }
  if (p.z > o.z + bx) { p.z = o.z + bx; v.z = Math.min(v.z, 0); }
  if (p.z < o.z - bx) { p.z = o.z - bx; v.z = Math.max(v.z, 0); }
  if (p.y > ceil)  { p.y = ceil;  v.y = Math.min(v.y, 0); }
  if (p.y < floor) { p.y = floor; v.y = 0; c.supported = true; }
}

function collide(a, b) {
  const pa = a.mesh.position, pb = b.mesh.position, S = 2 * RADIUS;
  const d = { x: pa.x - pb.x, y: pa.y - pb.y, z: pa.z - pb.z };
  const o = { x: S - Math.abs(d.x), y: S - Math.abs(d.y), z: S - Math.abs(d.z) };
  if (o.x <= 0 || o.y <= 0 || o.z <= 0) return;

  let axis = 'y', best = o.y * 0.75;                    // préférence pour la verticale (empilement)
  if (o.x < best) { axis = 'x'; best = o.x; }
  if (o.z < best) { axis = 'z'; best = o.z; }
  const pen = o[axis], s = d[axis] >= 0 ? 1 : -1;

  // le cube tenu n'est jamais repoussé, sauf quand il est posé sur un autre cube
  let wa = a === held ? 0 : 1, wb = b === held ? 0 : 1;
  if (axis === 'y') {
    if (a === held && s > 0) { wa = 1; wb = 0; }
    if (b === held && s < 0) { wb = 1; wa = 0; }
  }
  if (wa + wb === 0) return;
  const move = pen / (wa + wb);
  pa[axis] += s * move * wa;
  pb[axis] -= s * move * wb;

  const upper = s > 0 ? a : b, lower = s > 0 ? b : a;
  if (axis === 'y') {
    upper.supported = true;
    if (upper.velocity.y < lower.velocity.y) upper.velocity.y = lower.velocity.y;
    if (lower.velocity.y > upper.velocity.y) lower.velocity.y = upper.velocity.y;
  } else {
    const va = a.velocity[axis], vb = b.velocity[axis];
    if ((va - vb) * s < 0) {                            // ils se rapprochent : choc parfaitement mou
      a.velocity[axis] = b.velocity[axis] = (a === held || b === held) ? 0 : (va + vb) / 2;
    }
  }
}

function stepPhysics(dt) {
  for (const c of cubes) {
    c.supported = false;
    const p = c.mesh.position;
    if (c === held) { p.lerp(target, 0.35); c.velocity.set(0, 0, 0); continue; }
    c.velocity.y -= GRAVITY * dt;
    c.velocity.multiplyScalar(1 - AIR_DRAG * dt);
    if (c.velocity.length() > MAX_SPEED) c.velocity.setLength(MAX_SPEED);
    p.addScaledVector(c.velocity, dt);
  }
  for (let it = 0; it < 6; it++) {
    for (const c of cubes) clampToSurface(c);
    for (let i = 0; i < cubes.length; i++)
      for (let j = i + 1; j < cubes.length; j++) collide(cubes[i], cubes[j]);
  }
  for (const c of cubes) clampToSurface(c);
  const f = 1 - Math.exp(-FRICTION * dt);
  for (const c of cubes) if (c.supported && c !== held) { c.velocity.x -= c.velocity.x * f; c.velocity.z -= c.velocity.z * f; }
}

/* ---------- Boucle de rendu ---------- */
const fwd = new THREE.Vector3(), hit = new THREE.Vector3();
let reticleOk = false;
let lastFrame = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastFrame) / 1000, 1 / 30) || 1 / 60;
  lastFrame = now;
  if (haveOrientation) camera.quaternion.slerp(targetQ, 0.6);

  if (!surface.placed) {
    // le réticule suit le point où le regard rencontre la surface
    const drop = Number($('drop').value);
    camera.getWorldDirection(fwd);
    reticleOk = fwd.y < -0.08 && drop / -fwd.y < 6;
    if (reticleOk) {
      hit.copy(fwd).multiplyScalar(drop / -fwd.y);
      hit.y = -drop;
      surface.center.copy(hit);
    }
    surfaceGroup.visible = reticleOk;
    $('hint').textContent = reticleOk ? "Touche l'écran pour poser les cubes ici. Ajuste la hauteur de la surface avec le curseur." : 'Oriente le téléphone vers le bas, vers une table ou le sol.';
  } else {
    $('hint').textContent = held ? 'Cube attrapé : bouge la main, relâche ou lance !' : 'Pince pouce + index sur un cube pour l\'attraper (ou glisse-le au doigt).';
  }
  surfaceGroup.position.copy(surface.center);
  surfaceGroup.visible = surface.placed || reticleOk;

  if (surface.placed) {
    stepPhysics(dt);
    const q = Math.PI / 2, snap = 1 - Math.exp(-8 * dt);
    for (const c of cubes) {
      const m = c.mesh;
      if (c === held) { c.spin.set(0, 0, 0); m.rotation.y += 0.03; m.rotation.x += 0.012; }
      else if (c.supported) {
        for (const a of ['x', 'y', 'z']) m.rotation[a] += (Math.round(m.rotation[a] / q) * q - m.rotation[a]) * snap;
        c.spin.multiplyScalar(Math.exp(-6 * dt));
      } else {
        m.rotation.x += c.spin.x * dt; m.rotation.y += c.spin.y * dt; m.rotation.z += c.spin.z * dt;
      }
      const h = Math.max(0, m.position.y - floorY()), k = Math.min(h / 0.6, 0.8);
      c.shadow.rotation.z = m.rotation.y;
      c.shadow.position.set(m.position.x, surface.center.y + 0.002, m.position.z);
      c.shadow.scale.setScalar(RADIUS * (1.1 - k * 0.6));
      c.shadow.material.opacity = 0.5 * (1 - k);
      m.material.color.setHex(c === held ? COLOR_GRAB : c === hovering ? COLOR_HOVER : c.color);
      m.scale.setScalar(c === held ? 1.1 : 1);
    }
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* ---------- Démarrage : orientation, caméra arrière, mains ---------- */
const video = $('video');
const octx = $('overlay').getContext('2d');
let landmarker = null;

const withTimeout = (p, ms, label) => Promise.race([
  p, new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' : délai dépassé')), ms))
]);

$('go').addEventListener('click', async () => {
  $('err').textContent = '';
  // iOS exige une permission explicite, dans le geste de l'utilisateur
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') throw new Error('Capteurs de mouvement refusés');
    }
  } catch (e) {
    $('err').textContent = 'Accès aux capteurs impossible : ' + e.message + '. Sur iPhone : Réglages > Safari > Mouvement et orientation.';
    return;
  }
  addEventListener('ondeviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', onOrient);

  try {
    const ask = facingMode => withTimeout(navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
    }), 20000, 'Caméra');
    // caméra arrière imposée sur smartphone ; repli sur la caméra disponible (ordinateur de test)
    let stream;
    try { stream = await ask({ exact: 'environment' }); }
    catch { stream = await ask({ ideal: 'environment' }); }
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    $('err').textContent = 'Caméra indisponible : ' + e.message + '. La page doit être ouverte en HTTPS.';
    return;
  }
  $('start').style.display = 'none';
  started = true;
  setTimeout(() => { if (!haveOrientation) $('hint').textContent = 'Aucun capteur d\'orientation détecté : la vue restera fixe.'; }, 2000);
  loadHands();
});

async function loadHands() {
  $('model').textContent = 'Mains : chargement…';
  try {
    const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
    const vision = await withTimeout(import(base + '/vision_bundle.mjs'), 30000, 'Bibliothèque MediaPipe');
    const fileset = await withTimeout(vision.FilesetResolver.forVisionTasks(base + '/wasm'), 30000, 'Runtime WASM');
    const modelPath = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
    const make = delegate => vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: modelPath, delegate }, runningMode: 'VIDEO', numHands: 1
    });
    try { landmarker = await withTimeout(make('GPU'), 40000, 'Modèle (GPU)'); }
    catch { landmarker = await withTimeout(make('CPU'), 40000, 'Modèle (CPU)'); }
    $('model').textContent = 'Mains : prêt ✓';
  } catch (e) {
    $('model').textContent = 'Mains : indisponible (' + e.message + '). Glisse les cubes au doigt.';
  }
}

/* caméra arrière : pas de miroir ; mapping vidéo -> écran avec object-fit: cover */
function toScreen(lm) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(innerWidth / vw, innerHeight / vh);
  const ox = (vw * s - innerWidth) / 2, oy = (vh * s - innerHeight) / 2;
  return { x: lm.x * vw * s - ox, y: lm.y * vh * s - oy };
}
const BONES = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const setState = (cls, text) => { $('dot').className = 'dot ' + cls; $('stateText').textContent = text; };
let cx = 0, cy = 0, lastT = -1, smSize = 0;

function detect() {
  requestAnimationFrame(detect);
  if (!landmarker || video.readyState < 2 || video.currentTime === lastT) return;
  lastT = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  octx.clearRect(0, 0, innerWidth, innerHeight);

  if (!res.landmarks.length) {
    handActive = false; smSize = 0;
    if (held && !touching) endGrab();
    if (!touching) hovering = null;
    setState('', 'Aucune main');
    return;
  }
  handActive = true;
  const raw = res.landmarks[0], lm = raw.map(toScreen);

  octx.strokeStyle = 'rgba(255,255,255,.85)'; octx.lineWidth = 3;
  for (const [a, b] of BONES) { octx.beginPath(); octx.moveTo(lm[a].x, lm[a].y); octx.lineTo(lm[b].x, lm[b].y); octx.stroke(); }
  octx.fillStyle = '#38bdf8';
  for (const p of lm) { octx.beginPath(); octx.arc(p.x, p.y, 4, 0, 7); octx.fill(); }

  const rawSize = Math.hypot(raw[0].x - raw[9].x, raw[0].y - raw[9].y);
  smSize = smSize ? smSize + (rawSize - smSize) * 0.5 : rawSize;
  const pinchDist = Math.hypot(raw[4].x - raw[8].x, raw[4].y - raw[8].y) / smSize;
  cx += ((lm[4].x + lm[8].x) / 2 - cx) * 0.5; cy += ((lm[4].y + lm[8].y) / 2 - cy) * 0.5;

  const pinching = held && !touching ? pinchDist < 0.45 : pinchDist < 0.3;   // hystérésis
  hovering = held && !touching ? held : pickCube(cx, cy);

  octx.beginPath(); octx.arc(cx, cy, pinching ? 12 : 18, 0, 7);
  octx.strokeStyle = pinching ? '#fbbf24' : '#fff'; octx.lineWidth = 3; octx.stroke();

  if (surface.placed) {
    if (pinching && !held && hovering) startGrab(hovering, cx, cy, smSize);
    if (!pinching && held && !touching) endGrab();
    if (held && !touching) moveGrab(cx, cy, smSize);
  }
  setState(held ? 'pinch' : 'on', held ? 'Cube attrapé' : pinching ? 'Pincement (hors cube)' : 'Main détectée');
}
detect();
</script>
